name: Automatic Release on Version Change

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION_CODE=$(grep '^VERSION_CODE=' gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          VERSION_NAME=$(grep '^VERSION_NAME=' gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="1"; fi
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0.0"; fi
          TAG_NAME="v${VERSION_NAME}"
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Check if Tag or Release Exists
        id: check_release
        run: |
          TAG_NAME="${{ steps.version_info.outputs.tag_name }}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG_NAME already exists."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG_NAME does not exist. A new release will be created."
          fi

      - name: Build Library and Demo App
        if: steps.check_release.outputs.exists == 'false' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          ./gradlew :expressivemenu:assembleRelease :expressivemenu:publishToMavenLocal :app:assembleDebug

      - name: Prepare Release Artifacts
        if: steps.check_release.outputs.exists == 'false' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p release-artifacts
          VERSION_NAME="${{ steps.version_info.outputs.version_name }}"
          cp expressivemenu/build/outputs/aar/expressivemenu-release.aar release-artifacts/expressivemenu-${VERSION_NAME}.aar
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/ExpressiveMenu-Demo-${VERSION_NAME}.apk

      - name: Create Git Tag
        if: steps.check_release.outputs.exists == 'false' && github.event_name != 'workflow_dispatch'
        run: |
          TAG_NAME="${{ steps.version_info.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME (Version Code: ${{ steps.version_info.outputs.version_code }})"
          git push origin "$TAG_NAME"

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: ExpressiveMenu v${{ steps.version_info.outputs.version_name }}
          body: |
            ## ExpressiveMenu v${{ steps.version_info.outputs.version_name }} (Version Code: ${{ steps.version_info.outputs.version_code }})

            Automated release triggered by version code / version name update.

            ### Included Artifacts
            - **Library AAR**: `expressivemenu-${{ steps.version_info.outputs.version_name }}.aar`
            - **Demo App APK**: `ExpressiveMenu-Demo-${{ steps.version_info.outputs.version_name }}.apk`

            ### Integration (JitPack)
            ```groovy
            repositories {
                maven { url 'https://jitpack.io' }
            }
            dependencies {
                implementation 'com.github.cipher:ExpressiveMenu:v${{ steps.version_info.outputs.version_name }}'
            }
            ```
          files: |
            release-artifacts/*.aar
            release-artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
