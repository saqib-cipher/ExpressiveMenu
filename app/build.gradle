plugins {
    id 'com.android.application'
}

android {
    namespace 'com.grafixlab.expressivemenu.demo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.grafixlab.expressivemenu.demo'
        minSdk 21
        targetSdk 35
        versionCode project.hasProperty('VERSION_CODE') ? project.property('VERSION_CODE').toInteger() : 1
        versionName project.hasProperty('VERSION_NAME') ? project.property('VERSION_NAME') : '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':expressivemenu')
}
