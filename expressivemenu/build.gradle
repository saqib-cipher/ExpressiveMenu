plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.cipher.expressivemenu'
    compileSdk 35

    defaultConfig {
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

tasks.register('exportJar', Jar) {
    archiveBaseName = 'expressivemenu'
    dependsOn 'assembleRelease'
    from {
        zipTree(file("${layout.buildDirectory.get()}/outputs/aar/expressivemenu-release.aar")).matching {
            include 'classes.jar'
        }.collect { zipTree(it) }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.saqib-cipher'
                artifactId = 'expressivemenu'
                version = project.hasProperty('VERSION_NAME') ? project.property('VERSION_NAME') : '1.0.0'
            }
            expressiveMenuRepo(MavenPublication) {
                from components.release
                groupId = 'com.github.saqib-cipher'
                artifactId = 'ExpressiveMenu'
                version = project.hasProperty('VERSION_NAME') ? project.property('VERSION_NAME') : '1.0.0'
            }
        }
    }
}
